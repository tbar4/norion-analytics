# Cube for analytics.space_weather_events — the dbt mart built by the
# nasa_donki DAG.
#
# Defined over the MART, not the eleven raw DONKI tables. The union, the flare
# class split and the surrogate key all live in dbt where they are tested; this
# file only names measures and dimensions over the result.
#
# `sql_table` is schema-qualified because Cube connects to the `warehouse`
# database with no search_path set — an unqualified name would resolve to
# public and fail.

cubes:
  - name: space_weather_events
    sql_table: analytics.space_weather_events
    title: "Space Weather Events"
    description: >
      Every observed NASA DONKI space weather event on one timeline — coronal
      mass ejections, solar flares, geomagnetic storms, interplanetary shocks,
      solar energetic particles, magnetopause crossings, radiation belt
      enhancements and high speed streams. Excludes CME analyses, WSA+Enlil
      forecasts and SWRC notifications, none of which are observed events.

    dimensions:
      - name: event_key
        sql: event_key
        type: string
        primary_key: true
        # Cube hides primary keys by default. This one is a surrogate and is
        # not interesting to browse, so it stays hidden — unlike apod_daily,
        # where the key is also the only time dimension.
        public: false

      - name: event_time
        sql: event_time
        type: time
        title: "Event Time"
        description: >
          Event start. begin_time for flares, start_time for CMEs and storms,
          event_time for the rest.

      - name: event_date
        sql: event_date
        type: time
        title: "Event Date"
        description: Event start truncated to a day, for daily rollups.

      - name: event_type
        sql: event_type
        type: string
        title: "Event Type"
        description: 'CME, FLR, GST, IPS, SEP, MPC, RBE or HSS.'

      - name: event_id
        sql: event_id
        type: string
        description: >
          DONKI id. Unique only WITHIN an event_type — group by event_type too
          if you are counting distinct events.

      - name: flare_class
        sql: flare_class
        type: string
        title: "Flare Class"
        description: >
          GOES magnitude letter A/B/C/M/X, X being the most energetic. NULL for
          every non-flare event — expected, not missing data.

      - name: source_location
        sql: source_location
        type: string
        title: "Solar Location"
        description: >
          Position on the Sun, e.g. "N12W54". Populated for CME and FLR only.

      - name: observed_from
        sql: observed_from
        type: string
        title: "Observed From"
        description: >
          Vantage point for interplanetary shocks (Earth, STEREO A). NULL for
          other event types. NOT a location on the Sun.

      - name: active_region_num
        sql: active_region_num
        type: number
        title: "Active Region"
        description: >
          NOAA active region number the event came from. Populated for CME and
          FLR; the same region typically produces many events.

      - name: link
        sql: link
        type: string
        description: DONKI web page for the event.

      # dlt's load lineage, carried through every dbt layer. Filtering on this
      # isolates the rows a single pipeline run produced.
      - name: dlt_load_id
        sql: _dlt_load_id
        type: string
        title: "dlt Load ID"

    measures:
      - name: count
        type: count
        title: "Events"

      - name: cme_count
        type: count
        title: "Coronal Mass Ejections"
        filters:
          - sql: "{CUBE}.event_type = 'CME'"

      - name: flare_count
        type: count
        title: "Solar Flares"
        filters:
          - sql: "{CUBE}.event_type = 'FLR'"

      - name: storm_count
        type: count
        title: "Geomagnetic Storms"
        filters:
          - sql: "{CUBE}.event_type = 'GST'"

      - name: x_class_flare_count
        type: count
        title: "X-Class Flares"
        description: The most energetic flare class — the ones that matter.
        filters:
          - sql: "{CUBE}.flare_class = 'X'"

      - name: active_region_count
        sql: active_region_num
        type: count_distinct
        title: "Distinct Active Regions"
        description: >
          How many NOAA active regions produced events. Counts only CME and FLR
          rows, since nothing else carries a region.

      - name: first_event_time
        sql: event_time
        type: min
        title: "Earliest Event"

      - name: last_event_time
        sql: event_time
        type: max
        title: "Latest Event"

    pre_aggregations:
      # Daily event counts by type and flare class — the shape almost every
      # question about this cube takes.
      #
      # Built into Cube Store by the refresh worker, so a matching query never
      # touches Postgres. Verify a query actually HIT it rather than assuming:
      # the /v1/load response carries a `usedPreAggregations` object, and an
      # empty one means the query silently fell through to the warehouse.
      #
      # Only ADDITIVE measures are listed. count and the filtered counts can be
      # summed across rows, so one rollup at day granularity also answers
      # monthly and yearly questions. Deliberately omitted:
      #
      #   active_region_count   exact count_distinct — non-additive, cannot be
      #                         re-aggregated, so including it would tie this
      #                         rollup to exactly these dimensions
      #   first/last_event_time min/max ARE additive but are metadata rather
      #                         than something anyone charts
      #
      # Queries using the omitted measures still work; they just read Postgres.
      - name: events_by_type_daily
        measures:
          - CUBE.count
          - CUBE.cme_count
          - CUBE.flare_count
          - CUBE.storm_count
          - CUBE.x_class_flare_count
        dimensions:
          - CUBE.event_type
          - CUBE.flare_class
        time_dimension: CUBE.event_time
        granularity: day
        # No partition_granularity on purpose. The mart is ~2,600 rows for a
        # year and would still be tiny after a full backfill to DONKI's 2010
        # start. Partitioning buys nothing at this size and adds a build_range
        # to maintain. Add it if this ever reaches millions of rows.
        refresh_key:
          # Checked hourly, rebuilt only when the warehouse actually changed.
          #
          # Keyed on dlt's LOAD id, not on any event timestamp. This was
          # originally MAX(submission_time) — DONKI's own revision stamp — and
          # that was WRONG in a way that fails silently:
          #
          #   A backfill loads OLD events. Their submission_time is old too, so
          #   MAX(submission_time) does not move, so the rollup never
          #   invalidates, so Cube keeps serving pre-backfill numbers forever.
          #
          # Proven on 2026-07-29: backfilling 2010-2026 took the mart from 2,645
          # to 16,573 rows and changed MAX(submission_time) by exactly nothing —
          # zero backfilled rows were newer than the previous maximum. Cube went
          # on reporting 2,645.
          #
          # _dlt_load_id increases on EVERY load regardless of how old the loaded
          # data is, which is the property actually needed. count(*) is included
          # so a deletion or a rebuild that removes rows also invalidates.
          # Cast to numeric because the column is text and would otherwise
          # compare lexicographically.
          every: 1 hour
          sql: >
            SELECT MAX(_dlt_load_id::numeric)::text || ':' || COUNT(*)::text
            FROM analytics.space_weather_events
        scheduled_refresh: true
