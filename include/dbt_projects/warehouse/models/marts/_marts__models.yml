version: 2

# One file for all marts. Marts are business-facing and cross-source by
# nature, so grouping them per-source the way staging does would put related
# models in unrelated files.

models:
  - name: apod_daily
    description: >
      Astronomy Picture of the Day, one row per calendar day over the trailing
      window loaded by the nasa_apod pipeline. The model Cube's `apod_daily`
      cube is built on.
    columns:
      - name: apod_date
        description: APOD publication date. Natural key.
        data_tests:
          - not_null
          - unique
      - name: media_type
        description: '"image" or "video".'
        data_tests:
          - not_null
      - name: is_public_domain
        description: >
          True when the API returned no copyright holder. Common and expected —
          roughly a third of entries.
        data_tests:
          - not_null
      - name: is_video
        description: True for media_type = 'video'. These rows have no hdurl.
        data_tests:
          - not_null

  - name: space_weather_events
    description: >
      One timeline of every observed NASA DONKI space weather event — CME, FLR,
      GST, IPS, SEP, MPC, RBE, HSS. Excludes cme_analysis, the WSA+Enlil
      forecasts and the SWRC notifications, none of which are observed events.
      The model behind Cube's `space_weather_events` cube.
    columns:
      - name: event_key
        description: >
          Surrogate key, "<event_type>:<event_id>", and the declared grain of
          this table. DONKI ids happen to embed their own type, so event_id is
          unique today, but that is a naming convention rather than a promised
          guarantee. This is the test that would catch a botched union.
        data_tests:
          - not_null
          - unique
      - name: event_type
        description: 'CME, FLR, GST, IPS, SEP, MPC, RBE or HSS.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["CME", "FLR", "GST", "IPS", "SEP", "MPC", "RBE", "HSS"]
      - name: event_id
        description: DONKI id, unique only within its event_type.
        data_tests:
          - not_null
      - name: event_time
        description: >
          Event start. begin_time for flares, start_time for CMEs and storms,
          event_time for the rest.
        data_tests:
          - not_null
      - name: flare_class
        description: >
          GOES magnitude letter (A/B/C/M/X) for flares. NULL for every other
          event type — that is expected, not missing data.
      - name: source_location
        description: >
          Solar location, e.g. "N12W54". Populated for CME and FLR only.
      - name: observed_from
        description: >
          Observing vantage point for interplanetary shocks (Earth, STEREO A).
          NULL for every other event type. Not a location on the Sun.

  - name: neo_close_approaches
    description: >
      One row per asteroid close approach to Earth, from the NASA NeoWs feed.
      History accumulates run over run: the pipeline merges a trailing 7-day
      window rather than replacing, so this grows into a continuous record
      instead of holding only the last week. The model behind Cube's
      `neo_close_approaches` cube.
    columns:
      - name: approach_key
        description: >
          Surrogate key, "<asteroid_id>:<close_approach_date>", and the
          declared grain of this table. Neither component is unique alone — an
          asteroid returns on other dates, and many asteroids share a date.
          This is the test that would catch the pipeline's merge key regressing
          to `id` alone and silently collapsing history.
        data_tests:
          - not_null
          - unique
      - name: asteroid_id
        description: NASA JPL small-body id. Not unique on its own.
        data_tests:
          - not_null
      - name: close_approach_date
        description: Date of the approach. Half of the grain.
        data_tests:
          - not_null
      - name: miss_distance_km
        description: >
          Closest approach distance. Cast from a JSON string upstream — NeoWs
          returns these as text, and uncast they sort lexically.
        data_tests:
          - not_null
      - name: miss_distance_lunar
        description: >
          Same distance in lunar distances, where 1.0 is the Moon's orbit. The
          intuitive scale for how near a near miss was.
        data_tests:
          - not_null
      - name: is_potentially_hazardous_asteroid
        description: >
          NASA's PHA flag — minimum orbit intersection distance combined with
          absolute magnitude. A classification of the orbit, NOT a prediction
          that anything will hit Earth.
        data_tests:
          - not_null
      - name: is_closer_than_moon
        description: True when miss_distance_lunar < 1.0.
        data_tests:
          - not_null
      - name: est_diameter_m_mid
        description: >
          Midpoint of NASA's estimated diameter range. The range derives from
          an assumed albedo, so treat this as a ranking aid, not a measurement.
        data_tests:
          - not_null
      - name: orbiting_body
        description: Body approached. "Earth" throughout this feed.
        data_tests:
          - not_null

  - name: conjunction_events
    description: >
      Close approaches found by all-on-all SGP4 screening of the catalogue, one
      row per object pair per screening run. The model Cube's
      `conjunction_events` cube is built on.

      Miss distance, TCA and relative speed are COMPUTED. Collision probability
      is ESTIMATED from synthetic covariance derived from TLE scatter, because
      TLEs carry no covariance of their own — it ranks what deserves attention
      and is not a substitute for a CDM. The `estimated_` prefixes are load
      bearing; do not strip them downstream.
    columns:
      - name: conjunction_key
        description: >
          Surrogate key over (run, primary object, secondary object) — the
          grain. A pair recurs across runs as element sets are refreshed.
        data_tests:
          - not_null
          - unique
      - name: tca
        description: Time of closest approach, UTC.
        data_tests:
          - not_null
      - name: miss_distance_km
        description: Refined closest-approach distance in TEME.
        data_tests:
          - not_null
      - name: relative_speed_km_s
        description: Relative speed at TCA. Drives how short the encounter is.
        data_tests:
          - not_null
      - name: risk_band
        description: >
          Triage band derived from the ESTIMATED probability. Every value is
          prefixed "estimated" so the caveat travels with the label.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - estimated_high
                - estimated_elevated
                - estimated_low
                - estimated_negligible
      - name: is_intra_constellation
        description: >
          Both objects share a name prefix. These dominate the count once a
          large constellation is catalogued — 55,120 of 55,184 rows on the
          first real run — and their operator manoeuvres them automatically.
          Flagged rather than filtered so the exclusion stays the reader's
          choice.
        data_tests:
          - not_null
      - name: run_is_complete_screen
        description: >
          True only when the run examined its whole window AND had debris
          coverage from Space-Track. False means the screen under-reports.
        data_tests:
          - not_null
