version: 2

# One sources file per onboarded source, living beside that source's staging
# models. `raw` is the dlt dataset_name — dlt creates the schema in the
# Postgres `warehouse` database and dbt reads from it, so the `schema:` below
# must match `dataset_name` in include/pipelines/nasa_apod_pipeline.py.
#
# The source NAME is per-source (`nasa_apod`) while the SCHEMA is shared
# (`raw`). Every source declares the same schema and its own name, so
# `source('nasa_apod', 'apod')` reads raw.apod without the sources of different
# pipelines colliding in one file.

sources:
  - name: nasa_apod
    schema: raw
    description: >
      Landing tables written by include/pipelines/nasa_apod_pipeline.py.
      Loaded with write_disposition "merge" on the natural key `date`, one day
      per scheduled run, so the archive accumulates across runs rather than
      being a snapshot of a trailing window. Merge is load-bearing: under the
      previous "replace" disposition a one-day run would truncate the table to
      a single row.
    tables:
      - name: apod
        description: >
          NASA Astronomy Picture of the Day, one row per calendar day.
        columns:
          - name: date
            description: APOD publication date, YYYY-MM-DD. Natural key.
          - name: media_type
            description: '"image" or "video".'
          - name: copyright
            description: >
              Attribution. NULL for public-domain entries, which is common —
              do not treat NULL here as a load failure.
          - name: hdurl
            description: >
              High-resolution still. NULL for video entries, which have no HD
              image.
