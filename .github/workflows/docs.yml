# Publish the dbt docs and the Cube semantic-layer reference to GitHub Pages.
#
# The defining constraint: the warehouse lives at 10.0.0.50, a LAN address. A
# GitHub-hosted runner has no route to it and never will without a tunnel, so
# this job builds the docs WITHOUT a database connection:
#
#   dbt parse          writes manifest.json — pure parse, no connection
#   dbt docs generate  --no-compile reads that manifest off disk instead of
#                      recompiling; --empty-catalog skips the information_schema
#                      queries that would otherwise need the warehouse
#
# `--no-compile` is why `dbt parse` has to run first. On its own it makes
# `docs generate` look for a manifest that nothing has written, and the job dies
# on FileNotFoundError rather than anything that names the real problem.
#
# What this costs, precisely: the "Compiled" SQL tab, and warehouse-derived
# column types and table stats. Descriptions, columns, tests, sources, the
# lineage graph and the source SQL all come from the repo and are unaffected —
# and those are the substance for someone trying to understand the project.
# `dbt compile` is NOT an option here; it opens a connection and times out.
#
# Because everything published is derived from committed files, the site is
# exactly as fresh as the last push. No secrets are needed and nothing is
# exposed to the internet.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "include/dbt_projects/warehouse/**"
      - "semantic/cubes/**"
      - "scripts/build_docs_site.py"
      - "requirements-dbt.txt"
      - ".github/workflows/docs.yml"
  # So the site can be rebuilt on demand — after enabling Pages for the first
  # time, or to re-publish without an artificial commit.
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN has neither.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race. `cancel-in-progress: false` because a half-
# finished Pages deployment is worse than a slightly delayed one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  DBT_PROJECT_DIR: include/dbt_projects/warehouse

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dbt
        # The same pins the Airflow image builds /opt/dbt-venv from, so the
        # docs are generated by the version that actually runs the project.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dbt.txt pyyaml

      - name: Parse the project
        # No warehouse is reachable, so profiles.yml resolves to its env_var
        # defaults and the password stays empty. That is fine: parsing never
        # opens a connection. The step still needs a profile to EXIST.
        #
        # A relative --target-path resolves against the PROJECT dir, not the
        # working directory — verified, because the two differ here and the
        # assemble step below reads $DBT_PROJECT_DIR/target.
        run: |
          dbt parse \
            --project-dir "$DBT_PROJECT_DIR" \
            --profiles-dir "$DBT_PROJECT_DIR" \
            --target-path target

      - name: Generate dbt docs
        run: |
          dbt docs generate --static --no-compile --empty-catalog \
            --project-dir "$DBT_PROJECT_DIR" \
            --profiles-dir "$DBT_PROJECT_DIR" \
            --target-path target

      - name: Assemble the site
        # Also cross-checks every cube's sql_table against the dbt manifest and
        # annotates the run if one has drifted. Warns rather than fails; add
        # --strict to make drift block the publish.
        run: |
          python scripts/build_docs_site.py \
            --target "$DBT_PROJECT_DIR/target" \
            --cubes semantic/cubes \
            --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
